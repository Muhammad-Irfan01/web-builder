name: Build, Push and Deploy GrapesJS Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orcayo-grapes-builder:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/orcayo-grapes-builder:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_DASHBOARD_URL=${{ secrets.VITE_DASHBOARD_URL }}
            VITE_STORE_NAME=My Orcayo Store
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment
        run: |
          echo "Triggering Dokploy deployment webhook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -d "{\"ref\": \"${{ github.ref }}\", \"head_commit\": {\"id\": \"${{ github.sha }}\", \"message\": \"${{ github.event.head_commit.message }}\"}}" \
            "${{ secrets.DOKPLOY_WEBHOOK_URL }}")
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP Response Body: $HTTP_BODY"
          echo "HTTP Status Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Deployment trigger failed with code $HTTP_CODE"
            exit 1
          fi
